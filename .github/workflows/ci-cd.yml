name: CI/CD

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pull-request:
    name: Pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application and check dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit pytest ruff
          python -m pip check

      - name: Check formatting
        run: ruff format --check app

      - name: Run linting
        run: ruff check app

      - name: Run unit tests
        working-directory: app
        run: python -m pytest tests

      - name: Run software composition analysis
        working-directory: app
        run: python -m pip_audit -r requirements.txt
