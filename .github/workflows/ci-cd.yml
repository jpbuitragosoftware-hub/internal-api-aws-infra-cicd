name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pull-request:
    name: Pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

  checks:
    name: Checks
    needs: pull-request
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application and check dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pip-audit pytest ruff
          python -m pip check

      - name: Check formatting
        run: ruff format --check app

      - name: Run linting
        run: ruff check app

      - name: Run unit tests
        working-directory: app
        run: python -m pytest tests

      - name: Run software composition analysis
        working-directory: app
        run: python -m pip_audit -r requirements.txt

  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag internal-api:${{ github.sha }} ./app

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: internal-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: internal_api
          POSTGRES_USER: internal_api_user
          POSTGRES_PASSWORD: local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U internal_api_user -d internal_api"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag internal-api:test ./app

      - name: Initialize database schema
        run: >
          docker run --rm --network host
          -e DB_HOST=127.0.0.1
          -e DB_PORT=5432
          -e DB_NAME=internal_api
          -e DB_USER=internal_api_user
          -e DB_PASSWORD=local_password
          internal-api:test
          python -c "from app import initialize_database; initialize_database()"

      - name: Start API container
        run: >
          docker run --detach --name internal-api-test --network host
          -e DB_HOST=127.0.0.1
          -e DB_PORT=5432
          -e DB_NAME=internal_api
          -e DB_USER=internal_api_user
          -e DB_PASSWORD=local_password
          -e PORT=5000
          internal-api:test

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs internal-api-test
          exit 1

      - name: Test API endpoints
        run: |
          curl --silent --fail http://127.0.0.1:5000/health | grep -q '"status":"healthy"'
          curl --silent --fail http://127.0.0.1:5000/items | grep -q '^\[\]'
          response=$(curl --silent --fail \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"name":"CI integration test"}' \
            http://127.0.0.1:5000/items)
          echo "$response" | grep -q '"name":"CI integration test"'
          curl --silent --fail http://127.0.0.1:5000/items | grep -q 'CI integration test'

      - name: Show API logs on failure
        if: failure()
        run: docker logs internal-api-test

      - name: Stop API container
        if: always()
        run: docker rm --force internal-api-test

  deployment:
    name: Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: internal-api-aws-infra-cicd
      ECS_CLUSTER: internal-api-cluster
      ECS_SERVICE: internal-api-service
      ECS_TASK_DEFINITION: internal-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./app
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register new ECS task definition
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json
          jq --arg image "$IMAGE_URI" \
            '.containerDefinitions[0].image = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > task-definition-rendered.json
          echo "task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.task_definition }}"
