name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: internal-api-aws-infra-cicd
      ECS_CLUSTER: internal-api-cluster
      ECS_SERVICE: internal-api-service
      ECS_TASK_DEFINITION: internal-api
      ALB_NAME: api-internal-alb

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" ./app

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Register new ECS task definition
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          PREVIOUS_TASK_DEFINITION="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          echo "previous_task_definition=$PREVIOUS_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

          jq --arg image "$IMAGE_URI" \
            '.containerDefinitions[0].image = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > task-definition-rendered.json

          echo "task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)" >> "$GITHUB_OUTPUT"

      - name: Update ECS service and verify deployment
        env:
          PREVIOUS_TASK_DEFINITION: ${{ steps.task-definition.outputs.previous_task_definition }}
          TASK_DEFINITION: ${{ steps.task-definition.outputs.task_definition }}
        run: |
          set -euo pipefail

          print_deployment_diagnostics() {
            echo "Deployment diagnostics:"

            TARGET_GROUP_ARN="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text \
              --no-cli-pager)"

            echo "Target health:"
            aws elbv2 describe-target-health \
              --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'TargetHealthDescriptions[].{state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description,target:Target.Id}' \
              --output table \
              --no-cli-pager || true

            echo "Recent ECS events:"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].events[:5].message' \
              --output text \
              --no-cli-pager || true
          }

          rollback() {
            print_deployment_diagnostics
            echo "Deployment verification failed; rolling back to previous task definition: $PREVIOUS_TASK_DEFINITION"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "$PREVIOUS_TASK_DEFINITION" \
              --no-cli-pager > /dev/null

            wait_for_stable_service 12
          }

          wait_for_stable_service() {
            local max_attempts="$1"

            for attempt in $(seq 1 "$max_attempts"); do
              SERVICE_STATE="$(aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,rollout:deployments[0].rolloutState,rolloutReason:deployments[0].rolloutStateReason,taskDefinition:taskDefinition}' \
                --output json \
                --no-cli-pager)"

              if echo "$SERVICE_STATE" | jq -e \
                '.rollout == "FAILED"' > /dev/null; then
                echo "ECS deployment failed."
                echo "$SERVICE_STATE" | jq -c .
                return 1
              fi

              if echo "$SERVICE_STATE" | jq -e \
                '.pending == 0 and .running == .desired and .rollout == "COMPLETED"' > /dev/null; then
                return 0
              fi

              sleep 10
            done

            echo "ECS service did not become stable within $((max_attempts * 10 / 60)) minutes."
            echo "$SERVICE_STATE" | jq -c .
            return 1
          }

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --no-cli-pager > /dev/null

          if ! wait_for_stable_service 18; then
            rollback
            exit 1
          fi

          CURRENT_TASK_DEFINITION="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          if [ "$CURRENT_TASK_DEFINITION" != "$TASK_DEFINITION" ]; then
            echo "ECS did not keep the new task definition active: $CURRENT_TASK_DEFINITION"
            rollback
            exit 1
          fi

          TARGET_GROUP_ARN="$(aws elbv2 describe-target-groups \
            --names "$ALB_NAME-tg" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)"

          if ! aws elbv2 describe-target-health \
              --target-group-arn "$TARGET_GROUP_ARN" \
              --no-cli-pager \
              --output json | jq -e '.TargetHealthDescriptions | any(.[]; .TargetHealth.State == "healthy")' > /dev/null; then
            echo "No healthy ALB target found for the active ECS deployment."
            rollback
            exit 1
          fi

          ALB_DNS_NAME="$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)"

          SERVICE_NETWORK_CONFIGURATION="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)"

          jq -n \
            --arg cluster "$ECS_CLUSTER" \
            --arg task_definition "$TASK_DEFINITION" \
            --arg container_name "internal-api" \
            --arg alb_dns_name "$ALB_DNS_NAME" \
            --argjson network_configuration "$SERVICE_NETWORK_CONFIGURATION" \
            '{
              cluster: $cluster,
              taskDefinition: $task_definition,
              launchType: "FARGATE",
              networkConfiguration: {
                awsvpcConfiguration: $network_configuration
              },
              overrides: {
                containerOverrides: [{
                  name: $container_name,
                  command: [
                    "python",
                    "-c",
                    ("import json, sys, urllib.request; " +
                     "responses = [json.load(urllib.request.urlopen(\"http://\($alb_dns_name)\" + endpoint, timeout=5)) for endpoint in [\"/health\", \"/ready\"]]; " +
                     "print(json.dumps(responses)); " +
                     "sys.exit(0 if all(response.get(\"status\") == \"healthy\" for response in responses) else 1)")
                  ]
                }]
              }
            }' > smoke-task.json

          SMOKE_TASK_ARN="$(aws ecs run-task \
            --cli-input-json file://smoke-task.json \
            --query 'tasks[0].taskArn' \
            --output text \
            --no-cli-pager)"

          if [ -z "$SMOKE_TASK_ARN" ] || [ "$SMOKE_TASK_ARN" = "None" ]; then
            rollback
            exit 1
          fi

          SMOKE_STOPPED=false
          for attempt in {1..12}; do
            SMOKE_STATUS="$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$SMOKE_TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text \
              --no-cli-pager)"

            if [ "$SMOKE_STATUS" = "STOPPED" ]; then
              SMOKE_STOPPED=true
              break
            fi

            sleep 10
          done

          if [ "$SMOKE_STOPPED" != "true" ]; then
            aws ecs stop-task \
              --cluster "$ECS_CLUSTER" \
              --task "$SMOKE_TASK_ARN" \
              --reason "Smoke test timed out" \
              --no-cli-pager > /dev/null || true
            rollback
            exit 1
          fi

          SMOKE_EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$SMOKE_TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text \
            --no-cli-pager)"

          if [ "$SMOKE_EXIT_CODE" != "0" ]; then
            echo "Smoke test failed:"
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$SMOKE_TASK_ARN" \
              --query 'tasks[0].{lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containerReason:containers[0].reason,exitCode:containers[0].exitCode}' \
              --output table \
              --no-cli-pager || true
            echo "Smoke test exit code: $SMOKE_EXIT_CODE"
            rollback
            exit 1
          fi

          echo "ECS deployment completed successfully."
          echo "ALB target health validation passed."
          echo "Smoke test passed."
          echo "Deployment completed successfully."
